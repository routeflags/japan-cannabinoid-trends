name: Research Validation

# Structural and semantic validation of the research data contracts (G1-G7)
# plus the framework's own contract tests.
# See docs/specs/validation-framework.md §6 for the operating contract.
#
# - No raw data is uploaded or published by this workflow.
# - The JSON Schema / Cerberus difference gate (h.md §17) stays disabled until
#   JSON Schema master files exist (see docs/specs/validation-framework.md
#   §11 "JSON Schema 共存").

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    name: Cerberus validation framework
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies (pyproject.toml is the single source)
        run: |
          python -m pip install -e ".[dev]"

      - name: Run contract tests
        run: |
          python -m pytest

      - name: Validate registries
        run: |
          python -m validation.cli validate-registries

      - name: Audit processed artifacts
        run: |
          # Every committed data/processed artifact must be either re-derivable by
          # a registered transformation or explicitly declared non-reproducible
          # with its missing inputs named (src/processing/reproduce.py).
          python -m processing.cli audit-processed

      - name: Audit X identity exposure
        run: |
          # X post text, handles, display names and post permalinks must not be
          # tracked; publish the anonymized derivation instead.  The rule and its
          # justified exceptions live in src/validation/x_identity.py.
          python -m validation.cli audit-x-identity

      - name: Audit runs outside the frozen legacy list
        run: |
          # The live collectors write raw JSON outside the framework, so nothing
          # stopped a collection from landing in datasets/ without passing a gate.
          # Runs in the frozen legacy list are grandfathered; every other run must
          # satisfy the current contract, references included.
          python -m validation.cli audit-new-runs

      - name: Audit issue records
        run: |
          # Issue records must be machine-readable, and an OPEN P0 must not sit
          # quietly: Critical means it is resolved or its deferral is recorded.
          # P1 and below are reported, not fatal (a research backlog is normal).
          python -m validation.cli audit-issues

      - name: Validate data schema (bash)
        run: |
          bash scripts/validation/validate-data-schema.sh

      - name: Audit the publication contract (record only)
        run: |
          # The page validator that used to run here was inert: its depth rules
          # were unreachable and the data paths it checked did not exist, so it
          # reported 13 green pages while 13 of them cited a stale release.  The
          # rules now live in src/validation/publication_contract.py and run
          # record-only until the content refresh
          # (docs/reports/20261015c-publication-refresh-plan.md, phase 4) lands.
          python -m validation.cli audit-publication --output /tmp/publication-contract.json

      - name: Validate search emergence tracker
        run: |
          bash scripts/validation/validate-search-emergence-tracker.sh

      - name: Audit git tracking (report only)
        run: |
          python -m validation.cli audit-git-tracking --output /tmp/g6-git-tracking-inventory.json

      - name: Check taxonomy exports in sync
        run: |
          bash scripts/export/export-taxonomy.sh --output-dir /tmp/taxonomy-exports
          fail=0
          for base in content-taxonomy.ttl compound-taxonomy.ttl chemical-class-taxonomy.ttl \
              content-taxonomy.schema.jsonld compound-taxonomy.schema.jsonld chemical-class-taxonomy.schema.jsonld; do
            # The `# Generated:` timestamp line in .ttl is non-deterministic
            # (datetime.utcnow(); see docs/specs/validation-framework.md §6.1).
            if ! diff <(grep -v '^# Generated:' "exports/taxonomy/${base}") \
                <(grep -v '^# Generated:' "/tmp/taxonomy-exports/${base}"); then
              echo "::error::stale export: exports/taxonomy/${base} — regenerate with bash scripts/export/export-taxonomy.sh"
              fail=1
            fi
          done
          for base in iptc-mapping.yaml classification-rules.yaml; do
            if ! diff "exports/taxonomy/${base}" "/tmp/taxonomy-exports/${base}"; then
              echo "::error::stale export: exports/taxonomy/${base} — regenerate with bash scripts/export/export-taxonomy.sh"
              fail=1
            fi
          done
          exit $fail
