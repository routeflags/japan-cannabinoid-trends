name: Release Clean Archive

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  create-and-upload:
    name: Create Clean Archive & Upload to Zenodo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release identity from CITATION.cff
        id: identity
        run: |
          # The archive's embedded metadata is the source of truth: the
          # expected concept DOI and version are read from the release itself,
          # then checked back against the archive after it is built
          # (ISS-20261015-REL-015 permanent fix).
          VERSION="${GITHUB_REF_NAME#v}"
          CONCEPT_DOI=$(grep -A6 'identifiers:' CITATION.cff | grep 'value:' | head -1 | sed 's/.*value: "\(.*\)".*/\1/')
          if [ -z "$CONCEPT_DOI" ]; then
            echo "ERROR: no concept DOI in CITATION.cff identifiers"
            exit 1
          fi
          # Zenodo record id == the numeric suffix of the concept DOI; the
          # publish step versions that record so the series DOI stays stable.
          CONCEPT_RECORD_ID="${CONCEPT_DOI##*.}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "concept_doi=${CONCEPT_DOI}" >> "$GITHUB_OUTPUT"
          echo "concept_record_id=${CONCEPT_RECORD_ID}" >> "$GITHUB_OUTPUT"
          echo "Release identity: version=${VERSION} concept_doi=${CONCEPT_DOI} record=${CONCEPT_RECORD_ID}"

      - name: Create clean archive
        id: archive
        run: |
          CLEAN_DIR="clean-archive"
          mkdir -p "${CLEAN_DIR}"

          # Research-relevant only.  v1.13+ is a Study-scoped release for
          # cannabinoid-platform-trends; X is outside this release scope.
          INCLUDE_PATHS=(
            "datasets/cannabinoid-platform-trends"
            "docs/audits/gt-summary.json"
            "docs/specs"
            "docs/acceptance-criteria.md"
            "docs/migration-plan.md"
            "publication"
            "src"
            "tests"
            "pyproject.toml"
            "metadata"
            "LICENSE"
            "CITATION.cff"
            "CHANGELOG.md"
            "README.md"
            "methodology.md"
          )

          # Copy files, preserving repository-relative paths.
          for path in "${INCLUDE_PATHS[@]}"; do
            if [ -e "${path}" ]; then
              mkdir -p "${CLEAN_DIR}/$(dirname "${path}")"
              cp -r "${path}" "${CLEAN_DIR}/${path}"
            fi
          done

          # Remove unwanted files.
          rm -rf "${CLEAN_DIR}/.github" \
                 "${CLEAN_DIR}/.serena" \
                 "${CLEAN_DIR}/artifacts" \
                 "${CLEAN_DIR}/.opencode" \
                 "${CLEAN_DIR}/.gitignore" \
                 "${CLEAN_DIR}/.env" \
                 "${CLEAN_DIR}/.env.local" \
                 "${CLEAN_DIR}/opencode.json" \
                 "${CLEAN_DIR}/project.json" \
                 "${CLEAN_DIR}/project.yml" 2>/dev/null || true
          find "${CLEAN_DIR}" -name ".DS_Store" -delete 2>/dev/null || true
          find "${CLEAN_DIR}" -name "project.yml" -delete 2>/dev/null || true
          find "${CLEAN_DIR}" -type d \( -name "__pycache__" -o -name "*.egg-info" -o -name ".pytest_cache" \) -prune -exec rm -rf {} + 2>/dev/null || true

          # Create zip.
          VERSION="${{ steps.identity.outputs.version }}"
          ZIP_NAME="japan-cannabinoid-trends-v${VERSION}-clean.zip"
          cd "${CLEAN_DIR}"
          zip -r "../${ZIP_NAME}" . -x "*.DS_Store"
          cd ..

          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "=== Archive Summary ==="
          echo "Name: ${ZIP_NAME}"
          echo "Size: $(ls -lh "${ZIP_NAME}" | awk '{print $5}')"
          echo "Files: $(unzip -l "${ZIP_NAME}" | tail -1 | awk '{print $2}')"

      - name: Verify archive release identity
        run: |
          # Reject the archive when its embedded CITATION / datapackage /
          # README disagree with the release identity, or when it carries a
          # disallowed path (metadata/artifacts/ is legitimate; .github is not).
          python3 scripts/validation/check-release-archive.py \
            --archive "${{ steps.archive.outputs.zip_name }}" \
            --version "${{ steps.identity.outputs.version }}" \
            --concept-doi "${{ steps.identity.outputs.concept_doi }}"

      - name: Validate release manifest
        run: |
          # Validation-only gate (ISS-20261015-REL-014): the manifest declares
          # the intended release identity and archive scope; a drift between
          # the built zip and the manifest fails here, before Zenodo upload.
          # Never publishes or uploads; the generator only binds the canonical
          # scope (validation.release_manifest) to this version / concept DOI.
          python3 scripts/release/make-release-manifest.py \
            --version "${{ steps.identity.outputs.version }}" \
            --concept-doi "${{ steps.identity.outputs.concept_doi }}" \
            --archive "${{ steps.archive.outputs.zip_name }}" \
            --output release-manifest.json
          PYTHONPATH=src python3 -m validation.cli validate-release-manifest \
            --file release-manifest.json \
            --format json

      - name: Publish archive to Zenodo
        id: zenodo
        env:
          ZENODO_API_KEY: ${{ secrets.ZENODO_API_KEY }}
        run: |
          python3 scripts/release/publish-zenodo.py \
            --archive "${{ steps.archive.outputs.zip_name }}" \
            --version "${{ steps.identity.outputs.version }}" \
            --concept-record-id "${{ steps.identity.outputs.concept_record_id }}" \
            --expect-concept-doi "${{ steps.identity.outputs.concept_doi }}" \
            --format json

      - name: Upload archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-archive-v${{ steps.identity.outputs.version }}
          path: ${{ steps.archive.outputs.zip_name }}
          retention-days: 30

      - name: Summary
        run: |
          echo "## Release Archive Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${{ steps.identity.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Archive:** ${{ steps.archive.outputs.zip_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Concept DOI:** ${{ steps.identity.outputs.concept_doi }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Clean:** verified (no .github/.env/private/legacy X paths)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          STATUS="${{ steps.zenodo.outputs.zenodo_status }}"
          if [ "$STATUS" = "success" ]; then
            echo "## Zenodo DOI" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **DOI:** ${{ steps.zenodo.outputs.doi }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Concept DOI:** ${{ steps.zenodo.outputs.concept_doi }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$STATUS" = "skipped" ]; then
            echo "⚠️ Zenodo upload skipped (API key not set)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Zenodo status: ${STATUS}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
