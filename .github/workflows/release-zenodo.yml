name: Release Clean Archive

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  create-and-upload:
    name: Create Clean Archive & Upload to Zenodo
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create clean archive
        id: archive
        run: |
          # Create clean directory
          CLEAN_DIR="clean-archive"
          mkdir -p "${CLEAN_DIR}"
          
          # Define paths to include (research-relevant only)
          INCLUDE_PATHS=(
            "datasets"
            "docs/specs"
            "docs/acceptance-criteria.md"
            "docs/migration-plan.md"
            "publication"
            "src"
            "metadata"
            "LICENSE"
            "CITATION.cff"
            "CHANGELOG.md"
            "README.md"
            "methodology.md"
            ".gitignore"
          )
          
          # Copy files
          for path in "${INCLUDE_PATHS[@]}"; do
            if [ -e "${path}" ]; then
              mkdir -p "${CLEAN_DIR}/$(dirname "${path}")"
              cp -r "${path}" "${CLEAN_DIR}/"
            fi
          done
          
          # Remove any unwanted files
          rm -rf "${CLEAN_DIR}/.github" \
                 "${CLEAN_DIR}/.serena" \
                 "${CLEAN_DIR}/artifacts" \
                 "${CLEAN_DIR}/.opencode" \
                 "${CLEAN_DIR}/.env" \
                 "${CLEAN_DIR}/.env.local" 2>/dev/null || true
          
          find "${CLEAN_DIR}" -name ".DS_Store" -delete 2>/dev/null || true
          find "${CLEAN_DIR}" -name "*.DS_Store" -delete 2>/dev/null || true
          
          # Create zip
          VERSION="${GITHUB_REF_NAME}"
          ZIP_NAME="japan-cannabinoid-trends-${VERSION}-clean.zip"
          
          cd "${CLEAN_DIR}"
          zip -r "../${ZIP_NAME}" . -x "*.DS_Store"
          cd ..
          
          # Verify clean
          echo "=== Verification ==="
          if unzip -l "${ZIP_NAME}" | grep -qE "\.github|\.serena|artifacts|\.opencode|agent\.md"; then
            echo "❌ ERROR: Unwanted files found!"
            exit 1
          fi
          echo "✅ Archive is clean"
          
          # Output
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          
          # Show summary
          echo "=== Archive Summary ==="
          echo "Name: ${ZIP_NAME}"
          echo "Size: $(ls -lh "${ZIP_NAME}" | awk '{print $5}')"
          echo "Files: $(unzip -l "${ZIP_NAME}" | tail -1 | awk '{print $2}')"

      - name: Upload to Zenodo via API
        id: zenodo
        env:
          ZENODO_API_KEY: ${{ secrets.ZENODO_API_KEY }}
        run: |
          ZIP_NAME="${{ steps.archive.outputs.zip_name }}"
          VERSION="${{ steps.archive.outputs.version }}"
          
          if [ -z "${ZENODO_API_KEY}" ]; then
            echo "⚠️  ZENODO_API_KEY not set. Skipping Zenodo upload."
            echo "zenodo_status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "=== Creating Zenodo deposition ==="
          
          # Create new deposition
          DEPOSITION_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://zenodo.org/api/deposit/depositions" \
            -H "Authorization: Bearer ${ZENODO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "metadata": {
                "title": "CBX Online Trend Dataset 2026",
                "upload_type": "dataset",
                "description": "日本国内におけるカンナビノイド関連トレンドを追跡するロングジューデータセット。Google Trends（CBX / H4CBH / HHBD / CBX リキッド、12ヶ月週次）、X (Twitter) 147件（重複排除済み）、YouTube 24件（フィルタ済み）、COA 分析結果（ISO/IEC 17025 認定 2 社）を収録。",
                "creators": [{"name": "Routeflags Co., Ltd.", "affiliation": "Routeflags Co., Ltd."}],
                "keywords": ["cannabinoid", "CBX", "H4CBH", "HHBD", "Google Trends", "X (Twitter)", "YouTube", "Japan", "online trends", "search interest", "longitudinal data"],
                "license": "cc-by-4.0",
                "version": "'"${VERSION}"'"
              }
            }')
          
          HTTP_CODE=$(echo "$DEPOSITION_RESPONSE" | tail -1)
          DEPOSITION_BODY=$(echo "$DEPOSITION_RESPONSE" | sed '$d')
          
          echo "HTTP Status: ${HTTP_CODE}"
          echo "Response: ${DEPOSITION_BODY}" | jq . 2>/dev/null || echo "${DEPOSITION_BODY}"
          
          DEPOSITION_ID=$(echo "$DEPOSITION_BODY" | jq -r '.id // empty' 2>/dev/null)
          
          if [ -z "${DEPOSITION_ID}" ]; then
            echo "❌ Failed to create deposition (HTTP ${HTTP_CODE})"
            echo "zenodo_status=failed_create" >> "$GITHUB_OUTPUT"
            exit 0  # Don't fail the workflow, just log
          fi
          
          echo "✅ Created deposition: ${DEPOSITION_ID}"
          
          # Upload file
          echo ""
          echo "=== Uploading file ==="
          
          UPLOAD_RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT "https://zenodo.org/api/deposit/depositions/${DEPOSITION_ID}/files" \
            -H "Authorization: Bearer ${ZENODO_API_KEY}" \
            -F "file=@${ZIP_NAME}")
          
          UPLOAD_HTTP_CODE=$(echo "$UPLOAD_RESPONSE" | tail -1)
          UPLOAD_BODY=$(echo "$UPLOAD_RESPONSE" | sed '$d')
          
          echo "HTTP Status: ${UPLOAD_HTTP_CODE}"
          echo "Response: ${UPLOAD_BODY}" | jq . 2>/dev/null || echo "${UPLOAD_BODY}"
          
          FILE_ID=$(echo "$UPLOAD_BODY" | jq -r '.id // empty' 2>/dev/null)
          
          if [ -z "${FILE_ID}" ]; then
            echo "❌ Failed to upload file (HTTP ${UPLOAD_HTTP_CODE})"
            echo "zenodo_status=failed_upload" >> "$GITHUB_OUTPUT"
            exit 0  # Don't fail the workflow
          fi
          
          echo "✅ Uploaded file: ${FILE_ID}"
          
          # Publish deposition
          echo ""
          echo "=== Publishing deposition ==="
          
          PUBLISH_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://zenodo.org/api/deposit/depositions/${DEPOSITION_ID}/actions/publish" \
            -H "Authorization: Bearer ${ZENODO_API_KEY}")
          
          PUBLISH_HTTP_CODE=$(echo "$PUBLISH_RESPONSE" | tail -1)
          PUBLISH_BODY=$(echo "$PUBLISH_RESPONSE" | sed '$d')
          
          echo "HTTP Status: ${PUBLISH_HTTP_CODE}"
          echo "Response: ${PUBLISH_BODY}" | jq . 2>/dev/null || echo "${PUBLISH_BODY}"
          
          DOI=$(echo "$PUBLISH_BODY" | jq -r '.doi // empty' 2>/dev/null)
          CONCEPTDOI=$(echo "$PUBLISH_BODY" | jq -r '.conceptdoi // empty' 2>/dev/null)
          
          if [ -n "${DOI}" ]; then
            echo ""
            echo "🎉 Zenodo Upload Complete!"
            echo "DOI: ${DOI}"
            echo "Concept DOI: ${CONCEPTDOI}"
            echo "URL: https://doi.org/${DOI}"
            echo "zenodo_status=success" >> "$GITHUB_OUTPUT"
            echo "doi=${DOI}" >> "$GITHUB_OUTPUT"
            echo "concept_doi=${CONCEPTDOI}" >> "$GITHUB_OUTPUT"
          else
            echo ""
            echo "⚠️  Deposition created but publish may need manual action"
            echo "Check: https://zenodo.org/deposit/${DEPOSITION_ID}"
            echo "zenodo_status=needs_manual_publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-archive-${{ steps.archive.outputs.version }}
          path: ${{ steps.archive.outputs.zip_name }}
          retention-days: 30

      - name: Summary
        run: |
          echo "## Release Archive Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${{ steps.archive.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Archive:** ${{ steps.archive.outputs.zip_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Clean:** ✅ (.github, .serena, artifacts excluded)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          STATUS="${{ steps.zenodo.outputs.zenodo_status }}"
          if [ "$STATUS" = "success" ]; then
            echo "## Zenodo DOI" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **DOI:** ${{ steps.zenodo.outputs.doi }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Concept DOI:** ${{ steps.zenodo.outputs.concept_doi }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$STATUS" = "skipped" ]; then
            echo "⚠️ Zenodo upload skipped (API key not set)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Zenodo status: ${STATUS}" >> "$GITHUB_STEP_SUMMARY"
          fi
