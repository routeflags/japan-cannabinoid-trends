# =============================================================================
# IPTC Media Topics Mapping
# =============================================================================
# 独自 SKOS Concept と IPTC Media Topics の対応表
#
# IPTC Media Topics: https://cv.iptc.org/newscodes/mediatopic/
# NewsCodes: https://cv.iptc.org/newscodes/
#
# マッピング種別:
#   exactMatch: 完全に同一の概念
#   closeMatch: 近い概念（微妙な差異あり）
#   related: 関連するが同一ではない
#
# 注意: IPTC Media Topics はニュース記事向けの語彙であり、
#       SNS コンテンツ分類には完全に適用できない場合がある。
#       closeMatch を使用している場合は、マッピングの限界を認識すること。
#
# 更新履歴:
#   2026-10-02: 初版作成
#   2026-10-15: TAX-026 対応 (a)。化学クラス 2 概念 (chemclass-hydrogenated / chemclass-acetate)
#               を not_applicable として宣言。IPTC Media Topics はニュース主題語彙であり
#               化学構造クラスに対応する概念を持たないため、推測で対応付けない。
# =============================================================================

version: "1.1.0"
last_updated: "2026-10-15"

# IPTC Media Topics の URI スキーム
iptc_uri_scheme: "http://cv.iptc.org/newscodes/mediatopic/"

# =============================================================================
# コンテンツ分類マッピング
# =============================================================================

content_mapping:

