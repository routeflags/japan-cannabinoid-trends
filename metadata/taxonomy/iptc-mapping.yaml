# =============================================================================
# IPTC Media Topics Mapping
# =============================================================================
# 独自 SKOS Concept と IPTC Media Topics の対応表
#
# IPTC Media Topics: https://cv.iptc.org/newscodes/mediatopic/
# NewsCodes: https://cv.iptc.org/newscodes/
#
# マッピング種別:
#   exactMatch: 完全に同一の概念
#   closeMatch: 近い概念（微妙な差異あり）
#   related: 関連するが同一ではない
#
# 注意: IPTC Media Topics はニュース記事向けの語彙であり、
#       SNS コンテンツ分類には完全に適用できない場合がある。
#       closeMatch を使用している場合は、マッピングの限界を認識すること。
#
# 更新履歴:
#   2026-10-02: 初版作成
#   2026-10-15: TAX-026 対応 (a)。化学クラス 2 概念 (chemclass-hydrogenated / chemclass-acetate)
#               を not_applicable として宣言。IPTC Media Topics はニュース主題語彙であり
#               化学構造クラスに対応する概念を持たないため、推測で対応付けない。
#   2026-10-15: TAX-025 対応。intent 4 / format 4 を not_applicable へ移動（主題以外の
#               次元であり IPTC に対応概念が無い。TAX-026 の次元分離規則を適用）。
#               化合物 9 は deliberately_unmapped のまま 2 群に分け、群ごとに理由を記録。
#               化合物単位の IPTC 主題はリポジトリ内の証拠になく、外部語彙の確認は
#               未実施のため推測で対応付けない。version 1.1.0 → 1.2.0。
#   2026-11-04: THCNM を compound_mapping に追加（mapping_type: none）。化学的同一性が
#               未確認（THA は別名・商業名）であり、IPTC 主題も外部確認していないため
#               対応付けない。version 1.2.0 → 1.3.0。
#   2026-11-11: owner 指示の登録バッチ（13 語）と管理上の登録状態カテゴリ
#               jptr:compound-identity-unverified を追加（ISS-20261111-TAX-040）。
#               13 語は化学的同一性が未確認で識別子も未検証のため deliberately_unmapped、
#               カテゴリは主題分類ではないため not_applicable。IPTC 語彙の外部照会は
#               行っていない（推測で対応付けない）。version 1.3.0 → 1.4.0。
#   2026-11-11: CBE を cannabielsoin として同一性確認（FDA GSRS / Wikidata）。
#               compound-cbe を上記 13 語群から分離し、識別子はあるが IPTC 主題は
#               外部確認していないため deliberately_unmapped の別群に記録。
#               version 1.4.0 → 1.5.0。
#   2026-11-11: CBL を cannabicyclol、CBGa を cannabigerolic acid として同一性
#               確認（Wikidata / FDA GSRS / PubChem / ChEBI）。両語を 12 語群から
#               分離し、識別子はあるが IPTC 主題は外部確認していないため
#               deliberately_unmapped の別群に記録。version 1.5.0 → 1.6.0。
#   2026-11-11: THCP と THCJD について、owner が意図された範囲を C7 / C8 同族体ファミリー
#               （Δ8/Δ9 未指定）と確認した（ISS-20261111-TAX-040 追記）。10 語群の理由を
#               8 語（同一性未確認）+ 2 語（ファミリー範囲確認、単一レコード無し）に分けて
#               記述し、IPTC 主題は引き続き割り当てない。version 1.6.0 → 1.7.0。
#   2026-11-11: THCPO について、owner が意図された範囲を THCP-O-acetate（Δ8/Δ9
#               未指定）と確認した（ISS-20261111-TAX-040 追記）。管理カテゴリの
#               10 語群の理由を 7 語（同一性未確認）+ 3 語（ファミリー範囲確認、
#               単一レコード無し）に分けて記述し、IPTC 主題は引き続き割り当てな
#               い。version 1.7.0 → 1.8.0。
#   2026-11-11: owner が THCA を Δ9-THCA-A / THCA-B / Δ8-THCA、THCB を
#               Δ8-THCB / Δ9-THCB / THCB-O-acetate の検索トピック概念に分ける
#               ことを確認した（ISS-20261111-TAX-041）。6 概念を deliberately_
#               unmapped の別群に加え、IPTC 主題は外部確認していないため割り当て
#               ない。総称の compound-thca / compound-thcb は既存群に残す。
#               version 1.8.0 → 1.9.0。
#   2026-11-11: THCPO の記述を修正。owner の回答は「THCPO は THCP-O-acetate を指す」
#               であり異性体の指定が無いため、登録を異性体未指定の THCP-O-acetate ファミリー
#               として扱う（owner がファミリーを明示的に確認したものではない）。
#               カテゴリ所属は同義関係を確立しないことを明記。IPTC 主題は引き続き割り当てない。
#               version 1.9.0 → 1.9.1。
# =============================================================================

