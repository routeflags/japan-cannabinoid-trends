# =============================================================================
# マッピングの限界
# =============================================================================

# =============================================================================
# 対応範囲（coverage）
# =============================================================================
# 初版（2026-10-02）は部分対応である。どの概念を対応させ、どれを意図的に
# 外したかを明示する。黙って抜け落ちないようにするための宣言であり、
# 妥当性は tests/validation/test_taxonomy_consistency.py が検査する
# （mapped ∪ deliberately_unmapped ∪ not_applicable = taxonomy の全概念）。

coverage:
  status: "partial"
  scope_note: |
    対応対象は末端概念（化合物 38 + content 14 = 52）。
    カテゴリノード（7）は階層構造上の上位概念であり主題分類ではないため、対応対象外とする。
    化学クラス 2 概念（chemclass-hydrogenated / chemclass-acetate）は TAX-026 (a) で
    追加された第 2 次元の側面値であり、IPTC Media Topics に対応する主題が無いため
    not_applicable として宣言する（下記）。概念総数は 61（compound 45 + content 14 + chemclass 2）。
    TAX-025（2026-10-15）で 17 末端概念の区分を確定した: intent 4 と format 4 は
    主題以外の次元（投稿意図・表現形式）であり IPTC の主題語彙に対応する概念を持たないため
    not_applicable（TAX-026 の次元分離規則を適用）。化合物 9 は deliberately_unmapped のまま
    2 群に分けて群ごとに理由を記録した。化合物単位の IPTC 主題はリポジトリ内の証拠になく、
    外部語彙の確認は未実施のため推測で対応付けない。確認方法は verification を参照。
    2026-11-11 の owner 指示バッチ（ISS-20261111-TAX-040）で 13 化合物と管理上の
    登録状態カテゴリ 1 概念を追加した。13 化合物は deliberately_unmapped に加え、
    カテゴリは not_applicable に加えた。同日、owner が CBE・CBL・CBGa の意図された
    同一性を確認し、3 語は識別子を検証して taxonomy の compound_minor へ移したが、
    化合物単位の IPTC 主題は外部確認していないため deliberately_unmapped のまま
    別群に記録する。残る 10 語は管理カテゴリの群に残し、うち THCP・THCJD は owner が異性体未指定
    のファミリー範囲を確認し、THCPO は owner が THCP-O-acetate を指すことのみ確認して
    異性体を指定しなかったため、登録を異性体未指定ファミリーとして扱う（Δ8/Δ9 の各異性体は
    別物質で、ファミリーの単一レコードは無い。カテゴリ所属は同義関係を確立しない）。
    化合物単位の IPTC 対応付けは依然として行わない。
    2026-11-11 の owner 決定（ISS-20261111-TAX-041）で、THCA を Δ9-THCA-A /
    THCA-B / Δ8-THCA、THCB を Δ8-THCB / Δ9-THCB / THCB-O-acetate の検索トピックへ
    分ける 6 概念を追加した。いずれも deliberately_unmapped の別群に加え、IPTC
    主題は割り当てない。総称の compound-thca / compound-thcb は既存の群に残す。

  deliberately_unmapped:
    - concepts:
        - "jptr:compound-delta9-thca-a"
        - "jptr:compound-thca-b"
        - "jptr:compound-delta8-thca"
        - "jptr:compound-delta8-thcb"
        - "jptr:compound-delta9-thcb"
        - "jptr:compound-thcb-o-acetate"
      reason: "2026-11-11 の owner 決定（ISS-20261111-TAX-041）で登録した、THCA / THCB の総称的な化学解釈を置き換える 6 つの検索トピック概念。Δ9-THCA-A・THCA-B は Moreno-Sanz 2016（DOI 10.1089/can.2016.0008）と Filer 2021（DOI 10.1089/can.2021.0003、PMCID PMC8612408）が命名・構造を記録し、Δ8-THCB・Δ9-THCB は Linciano et al. 2020（DOI 10.1021/acs.jnatprod.9b00876）と Tanaka & Kikura-Hanajiri 2024（DOI 10.1248/yakushi.24-00029）が分析物質として記録し、THCB-O-acetate の Δ8/Δ9 両異性体は 2024 年の厚生労働省令（令和6年厚生労働省令第81号）の構造グループに列挙されている。ただし登録文字列について単一の検証済み外部識別子を選択しておらず（Δ8-THCA は構造・命名の出所も未検証）、IPTC Media Topics の化合物単位の主題も外部確認していない。対応付けは推測になるため deliberately_unmapped のままとする。"
    - concepts:
        - "jptr:compound-cbc"
        - "jptr:compound-cbdv"
      reason: "マイナー・フィトカンナビノイド。taxonomy の識別子は 2026-11-15 に検証済み（CBC = ChEBI 3357 / Wikidata Q410949、CBDV = 立体異性体グループの Wikidata Q1104117。CBDV の ChEBI 182159 は立体化学を定義したレコードのため付けない。ISS-20261115-TAX-043）が、IPTC Media Topics 側の対応主題はリポジトリ内の証拠に無い。対応済みの 6 主題はいずれも化合物単位ではない広いニュース主題である。化合物単位の IPTC 対応付けには IPTC 語彙の外部確認が必要であり、未実施のため推測で対応付けない。"
    - concepts:
        - "jptr:compound-thcv"
      reason: "THCV は taxonomy に `skos:exactMatch` を持たない（ISS-20261115-TAX-043）。概念が Δ8/Δ9 の位置異性体と立体化学を指定しておらず、検証済みの外部レコード（CHEBI:755032、Wikidata Q76009679、Wikidata Q254768）はいずれも Δ9 を指すため。化合物識別子が未確定の概念に IPTC 主題を割り当てない。"
    - concepts:
        - "jptr:compound-thch"
        - "jptr:compound-hhc"
        - "jptr:compound-hhch"
        - "jptr:compound-thc-o"
        - "jptr:compound-crdp"
        - "jptr:compound-crdh"
      reason: "taxonomy に外部識別子（ChEBI / Wikidata exactMatch）が無く、化合物識別子自体が外部未検証。HHC/HHCH/THCH/THC-O は立体異性体・Δ体の総称であり単一 exactMatch は混同を招くこと、CRDP/CRDH は化学構造不明であることが docs/provenance/compound-taxonomy.md に記録されている。識別子が未検証の概念に IPTC 主題を割り当てることは推測になるため、IPTC 語彙の外部確認と識別子の検証が済むまで未対応として残す。"
    - concepts:
        - "jptr:compound-thcb"
        - "jptr:compound-thcp"
        - "jptr:compound-thcjd"
        - "jptr:compound-thcpo"
        - "jptr:compound-hhcpo"
        - "jptr:compound-cbnd"
        - "jptr:compound-cbp"
        - "jptr:compound-10-oh-hhc"
        - "jptr:compound-thxe"
        - "jptr:compound-thca"
      reason: "2026-11-11 の owner 指示で登録した 13 語のうち、管理カテゴリ jptr:compound-identity-unverified に残る 10 語（ISS-20261111-TAX-040）。うち 7 語（THCB / HHCPO / CBND / CBP / 10-OH-HHC / THXE / THCA）は化学的同一性が未確認で、識別子も検証していない。`THCP`・`THCJD` は 2026-11-11 に owner が意図された範囲を C7 同族体（tetrahydrocannabiphorol）・C8 同族体（THC-JD / 3-octyl-THC）の異性体未指定ファミリーと確認した。`THCPO` は owner が確認質問「`THCPO` は THCP-O-acetate を指しますか？」に `y` と回答し、異性体を名指ししなかったため、登録を異性体未指定の THCP-O-acetate ファミリーとして扱う（ファミリー扱いは回答の登録上の整理であり、owner がファミリーを明示的に確認したものではない）。各異性体の識別子は docs/provenance/compound-taxonomy.md に記録したが、登録語は単一物質でも単一レコードでもないため family への exactMatch は張らない。カテゴリ所属は同義関係を確立せず、英語 skos:altLabel `THCP-O-acetate` は概念の scopeNote に根拠を記録した検索スコープの別名である。THCPO の両異性体が 2024 年の厚生労働省令の構造グループに該当することも台帳に記録したが、それは省令の「麻薬を除く」除外規定の下での法令上の構造の事実であり、個々の製品・検索結果の分類ではなく、規制判断でも、owner の同一性確認の一部でもない。所属カテゴリは管理上の登録状態カテゴリであり、route・化学クラス・天然存在の根拠でも、それ自体が規制分類を行うものでもない。化合物主題の割り当ては単一異性体を選ぶことになり、IPTC 語彙の外部確認も行っていないため、対応付けない。"
    - concepts:
        - "jptr:compound-cbe"
      reason: "CBE は 2026-11-11 に owner が cannabielsoin と確認し、FDA GSRS（UNII 2ERD6V6652 / CAS 52025-76-0 / PubChem CID 162113）と Wikidata Q22668702 で識別子を検証した。taxonomy では compound_minor に置く。ただし IPTC Media Topics はニュース主題語彙であり、化合物単位の主題対応は外部確認していない。対応付けは推測になるため deliberately_unmapped のままとする。"
    - concepts:
        - "jptr:compound-cbl"
        - "jptr:compound-cbga"
      reason: "CBL は cannabicyclol（Wikidata Q907909 / FDA GSRS UNII MP5WZK8M5U / PubChem CID 30607・59444380）、CBGa は cannabigerolic acid（ChEBI 67081 / Wikidata Q27135612 / FDA GSRS UNII 80I4ZM847Y / PubChem CID 6449999）として、2026-11-11 に owner が意図された同一性を確認し、識別子を検証した。taxonomy では両語とも compound_minor に置く。ただし IPTC Media Topics はニュース主題語彙であり、化合物単位の主題対応は外部確認していない。対応付けは推測になるため deliberately_unmapped のままとする。"
  not_applicable:
    - concepts:
        - "jptr:compound-endocannabinoid"
        - "jptr:compound-major"
        - "jptr:compound-minor"
        - "jptr:compound-rare"
        - "jptr:compound-semisynthetic"
        - "jptr:compound-synthetic"
      reason: "taxonomy の上位概念（カテゴリ）。主題分類ではないため IPTC との対応は定義しない。"
    - concepts:
        - "jptr:compound-identity-unverified"
      reason: "経路・由来のカテゴリではなく、owner が名指しした登録語のうち化学的同一性が未確認のものをまとめる**管理上の登録状態カテゴリ**（ISS-20261111-TAX-040）。カテゴリノードであり主題分類ではないため IPTC 主題を定義しない。members は単一物質としての同一性が未確認であるため（`THCP` と `THCJD` は異性体未指定のファミリー範囲のみ確認）、このカテゴリから members への IPTC 主題割り当ても行わない（members は deliberately_unmapped に別途宣言）。"
    - concepts:
        - "jptr:intent-commercial"
        - "jptr:intent-experiential"
        - "jptr:intent-harm-report"
        - "jptr:intent-informational"
      reason: "投稿の意図（情報提供 / 商業 / 体験談 / 被害報告）は主題ではなく分類の別次元であり、IPTC Media Topics（ニュース記事の主題語彙）に対応する概念を持たない。例えば商業意図を Marketing に対応付けると intent 次元と topic 次元を混同することになり、TAX-026 の次元分離規則に反する。content-taxonomy の 3 scheme 分離と standards-compliance-analysis §4.3（topic のみ schema:about、intent/format はカスタム）が根拠。推測で対応付けない（TAX-025 記録 2026-10-15）。"
    - concepts:
        - "jptr:format-image"
        - "jptr:format-link"
        - "jptr:format-text"
        - "jptr:format-video"
      reason: "投稿の形式（text / image / video / link）は主題ではなく表現形式であり、IPTC Media Topics の対象外。intent と同じく次元分離規則により対応付けない（TAX-025 記録 2026-10-15）。"
    - concepts:
        - "jptr:chemclass-hydrogenated"
        - "jptr:chemclass-acetate"
      reason: "化学クラス（水素化・アセテート体）は化学構造による側面値であり、ニュース記事の主題を表す IPTC Media Topics に対応する概念を持たない。推測で対応付けない（TAX-026 記録 2026-10-15）。"

limitations:
  - "IPTC Media Topics はニュース記事向けの語彙であり、SNS コンテンツ分類には完全に適用できない場合がある"
  - "closeMatch マッピングは概念的に近いが完全に同一ではない"
  - "一部のカンナビノイド化合物（CBX, H4CBH, HHBD, THCNM、および 2026-11-11 に登録した語のうち同一性が未確認の 10 語）は ChEBI / Wikidata の対応エントリを確認していない（不在の断定ではない）"
  - "CBE・CBL・CBGa は識別子を検証済みだが、化合物単位の IPTC 主題は外部確認していないため deliberately_unmapped である（識別子の有無と IPTC 主題の有無は別）"
  - "投稿意図（intent 4）・表現形式（format 4）に IPTC Media Topics の対応概念は無い。IPTC はニュース主題語彙であり、意図・形式は別次元のため対応付けない（TAX-025 記録 2026-10-15）"
  - "THCV は `skos:exactMatch` を持たない。概念が Δ8/Δ9 の位置異性体と立体化学を指定しておらず、検証済みレコードは Δ9 のみのため（ISS-20261115-TAX-043）"
  - "化合物 28 概念の IPTC 対応付けには IPTC 語彙の外部確認が必要であり未実施。リポジトリ内の証拠だけでは化合物単位の主題を特定できないため推測で対応付けない。化合物識別子の正本は ChEBI / Wikidata（taxonomy の exactMatch）である"
  - "化学クラス（水素化・アセテート体）に IPTC Media Topics の対応概念は無い。IPTC はニュース主題語彙であり化学構造クラスを持たないため、推測で対応付けない（TAX-026 記録 2026-10-15）"
  - "IPTC Topic ID は変更される可能性があるため、定期的な検証が必要"

