      セール・キャンペーンは Marketing に近い。

  - skos_id: "jptr:topic-review"
    skos_prefLabel_en: "Review"
    skos_prefLabel_ja: "レビュー"
    iptc_topic_id: "20000349"
    iptc_topic_name: "Reviews"
    iptc_topic_uri: "http://cv.iptc.org/newscodes/mediatopic/20000349"
