# =============================================================================
# マッピングの限界
# =============================================================================

# =============================================================================
# 対応範囲（coverage）
# =============================================================================
# 初版（2026-10-02）は部分対応である。どの概念を対応させ、どれを意図的に
# 外したかを明示する。黙って抜け落ちないようにするための宣言であり、
# 妥当性は tests/validation/test_taxonomy_consistency.py が検査する
# （mapped ∪ deliberately_unmapped ∪ not_applicable = taxonomy の全概念）。

coverage:
  status: "partial"
  scope_note: |
    対応対象は末端概念（化合物 18 + content 14 = 32）。
    カテゴリノードは階層構造上の上位概念であり主題分類ではないため、対応対象外とする。
    化学クラス 2 概念（chemclass-hydrogenated / chemclass-acetate）は TAX-026 (a) で
    追加された第 2 次元の側面値であり、IPTC Media Topics に対応する主題が無いため
    not_applicable として宣言する（下記）。概念総数は 40（compound 24 + content 14 + chemclass 2）。

  deliberately_unmapped:
    - concepts:
        - "jptr:compound-cbc"
        - "jptr:compound-cbdv"
        - "jptr:compound-crdh"
        - "jptr:compound-crdp"
        - "jptr:compound-hhc"
        - "jptr:compound-hhch"
        - "jptr:compound-thc-o"
        - "jptr:compound-thch"
        - "jptr:compound-thcv"
      reason: "初版で未対応。IPTC Media Topics に対応する主題があるか未調査であり、推測で対応付けるよりは未対応として残す。"
    - concepts:
        - "jptr:intent-commercial"
        - "jptr:intent-experiential"
        - "jptr:intent-harm-report"
        - "jptr:intent-informational"
      reason: "IPTC Media Topics はニュース記事の主題を表す語彙であり、投稿の意図（情報提供 / 商業 / 体験談 / 被害報告）に対応する概念を持たない。"
    - concepts:
        - "jptr:format-image"
        - "jptr:format-link"
        - "jptr:format-text"
        - "jptr:format-video"
      reason: "投稿の形式（text / image / video / link）は IPTC Media Topics の対象外（主題ではなく表現形式）。"
  not_applicable:
    - concepts:
        - "jptr:compound-endocannabinoid"
        - "jptr:compound-major"
        - "jptr:compound-minor"
        - "jptr:compound-rare"
        - "jptr:compound-semisynthetic"
        - "jptr:compound-synthetic"
      reason: "taxonomy の上位概念（カテゴリ）。主題分類ではないため IPTC との対応は定義しない。"
    - concepts:
        - "jptr:chemclass-hydrogenated"
        - "jptr:chemclass-acetate"
      reason: "化学クラス（水素化・アセテート体）は化学構造による側面値であり、ニュース記事の主題を表す IPTC Media Topics に対応する概念を持たない。推測で対応付けない（TAX-026 記録 2026-10-15）。"

limitations:
  - "IPTC Media Topics はニュース記事向けの語彙であり、SNS コンテンツ分類には完全に適用できない場合がある"
  - "closeMatch マッピングは概念的に近いが完全に同一ではない"
  - "一部のカンナビノイド化合物（CBX, H4CBH, HHBD）は ChEBI / Wikidata に対応エントリがない"
  - "化学クラス（水素化・アセテート体）に IPTC Media Topics の対応概念は無い。IPTC はニュース主題語彙であり化学構造クラスを持たないため、推測で対応付けない（TAX-026 記録 2026-10-15）"
  - "IPTC Topic ID は変更される可能性があるため、定期的な検証が必要"

