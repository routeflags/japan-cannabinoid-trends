    skos_prefLabel_en: "Ingredient/Composition Discussion"
    skos_prefLabel_ja: "配合/成分"
    iptc_topic_id: "20000347"
    iptc_topic_name: "Chemistry"
    iptc_topic_uri: "http://cv.iptc.org/newscodes/mediatopic/20000347"
    mapping_type: "closeMatch"
    confidence: "medium"
    notes: |
      IPTC Chemistry は化学全般をカバーするが、
      カンナビノイドの配合比議論には限定的。
      最も近いマッピング。

  - skos_id: "jptr:topic-product"
    skos_prefLabel_en: "New Product/Arrival"
    skos_prefLabel_ja: "新商品/入荷"
    iptc_topic_id: "20000323"
    iptc_topic_name: "Products and Services"
    iptc_topic_uri: "http://cv.iptc.org/newscodes/mediatopic/20000323"
    mapping_type: "closeMatch"
    confidence: "high"
    notes: |
      製品発表・入荷情報は Products and Services に近い。

  - skos_id: "jptr:topic-effect"
    skos_prefLabel_en: "Effect/Experience"
    skos_prefLabel_ja: "体感/効果"
    iptc_topic_id: "20000329"
    iptc_topic_name: "Health and Fitness"
    iptc_topic_uri: "http://cv.iptc.org/newscodes/mediatopic/20000329"
    mapping_type: "closeMatch"
    confidence: "medium"
    notes: |
      体感・効果は Health and Fitness に近いが、
      医療的主張ではなく主観的報告である点に注意。

  - skos_id: "jptr:topic-promotion"
